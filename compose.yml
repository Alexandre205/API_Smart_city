services:
  postgres_database:
    build: 
      context: .
      dockerfile: DB_Dockerfile
    container_name: database
    environment:
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    container_name: smart_city_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_cache:/data

  api:
    build:
      context: .
      dockerfile: API_Dockerfile
    container_name: smart_city_api
    ports:
      - "3001:3001"
    env_file:
    - .env
    environment:
      DB_HOST: postgres_database #ecrase le host du .env
    depends_on:
      postgres_database:
        condition: service_healthy
      redis:
        condition: service_started
    
        
volumes:
  db_data:
  redis_cache: